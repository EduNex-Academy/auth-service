# Production Cookie Configuration for HTTPS Cross-Origin
app.security.cookies.secure=true
app.security.cookies.same-site=None
app.security.cookies.http-only=true

# Production CORS settings
# These will be handled in SecurityConfig.java with proper domain patterns

# Production Keycloak URLs (these should be set via environment variables)
# keycloak.server-url=https://keycloak-auth.edunex.app
# app.keycloak.server-url=https://keycloak-auth.edunex.app

# Production logging
logging.level.org.springframework.security=INFO
logging.level.org.keycloak=INFO
logging.level.org.springframework=WARN
logging.level.com.edu.auth_service=INFO
