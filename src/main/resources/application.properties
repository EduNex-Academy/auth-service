server.port=${SERVER_PORT}

spring.application.name=auth-service

# Keycloak Configuration - JWT Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_SERVER_URL}/realms/${KEYCLOAK_REALM}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_SERVER_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs

# Keycloak Admin Client Configuration (Service Account)
keycloak.server-url=${KEYCLOAK_SERVER_URL}
keycloak.realm=${KEYCLOAK_REALM}
keycloak.client-id=${KEYCLOAK_CLIENT_ID}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}

# Application specific configuration
app.keycloak.realm=${KEYCLOAK_REALM}
app.keycloak.client-id=${KEYCLOAK_CLIENT_ID}
app.keycloak.server-url=${KEYCLOAK_SERVER_URL}

app.keycloak.admin-google-login-url=${KEYCLOAK_SERVER_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/auth?client_id=${KEYCLOAK_CLIENT_ID}&response_type=code&scope=openid&kc_idp_hint=google&redirect_uri=${KEYCLOAK_ADMIN_REDIRECT_URI}
app.keycloak.student-google-login-url=${KEYCLOAK_SERVER_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/auth?client_id=${KEYCLOAK_CLIENT_ID}&response_type=code&scope=openid&kc_idp_hint=google&redirect_uri=${KEYCLOAK_STUDENT_REDIRECT_URI}
app.keycloak.instructor-google-login-url=${KEYCLOAK_SERVER_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/auth?client_id=${KEYCLOAK_CLIENT_ID}&response_type=code&scope=openid&kc_idp_hint=google&redirect_uri=${KEYCLOAK_INSTRUCTOR_REDIRECT_URI}

app.keycloak.admin-password-reset-redirect-uri=${KEYCLOAK_ADMIN_PASSWORD_RESET_REDIRECT_URI}
app.keycloak.student-password-reset-redirect-uri=${KEYCLOAK_STUDENT_PASSWORD_RESET_REDIRECT_URI}
app.keycloak.instructor-password-reset-redirect-uri=${KEYCLOAK_INSTRUCTOR_PASSWORD_RESET_REDIRECT_URI}

# Email verification redirect URIs
app.keycloak.admin-email-verification-redirect-uri=${KEYCLOAK_ADMIN_EMAIL_VERIFICATION_REDIRECT_URI:http://localhost:3001/admin/profile}
app.keycloak.student-email-verification-redirect-uri=${KEYCLOAK_STUDENT_EMAIL_VERIFICATION_REDIRECT_URI:http://localhost:3000/student/profile}
app.keycloak.instructor-email-verification-redirect-uri=${KEYCLOAK_INSTRUCTOR_EMAIL_VERIFICATION_REDIRECT_URI:http://localhost:3000/instructor/profile}

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# Logging Configuration
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.level.org.keycloak=${LOG_LEVEL_KEYCLOAK:INFO}
logging.level.org.springframework=${LOG_LEVEL_SPRING:INFO}
logging.level.com.edu.auth_service=DEBUG

# Health check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Cookie Configuration for HTTPS
app.security.cookies.refresh-token-name=refreshToken
app.security.cookies.refresh-token-max-age-days=1
app.security.cookies.secure=${COOKIE_SECURE:true}
app.security.cookies.same-site=${COOKIE_SAME_SITE:None}
app.security.cookies.path=/
app.security.cookies.http-only=true
