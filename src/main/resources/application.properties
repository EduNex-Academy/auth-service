server.port=8081

spring.application.name=auth-service
spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Keycloak Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/edunex-platform
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/edunex-platform/protocol/openid-connect/certs

# Keycloak Admin Client Configuration
keycloak.server-url=http://localhost:8080
keycloak.realm=edunex-platform
keycloak.admin-username=admin
keycloak.admin-password=admin
keycloak.client-id=edunex-platform-client
keycloak.client-secret=uIaR8wMBdeKoXzOEysRS8lN8fzRBezgG

# Application specific configuration
app.keycloak.realm=edunex-platform
app.keycloak.client-id=edunex-platform-client
app.keycloak.client-secret=uIaR8wMBdeKoXzOEysRS8lN8fzRBezgG
app.keycloak.server-url=http://localhost:8080

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

logging.level.org.springframework.security=DEBUG
logging.level.org.keycloak=DEBUG
logging.level.org.springframework=INFO
