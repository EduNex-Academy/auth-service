server.port=${SERVER_PORT:8081}

spring.application.name=auth-service
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auth_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Keycloak Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_SERVER_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:edunex-platform}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_SERVER_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:edunex-platform}/protocol/openid-connect/certs

# Keycloak Admin Client Configuration
keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8080}
keycloak.realm=${KEYCLOAK_REALM:edunex-platform}
keycloak.admin-username=${KEYCLOAK_ADMIN_USERNAME:admin}
keycloak.admin-password=${KEYCLOAK_ADMIN_PASSWORD:admin}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:edunex-platform-client}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:uIaR8wMBdeKoXzOEysRS8lN8fzRBezgG}

# Application specific configuration
app.keycloak.realm=${KEYCLOAK_REALM:edunex-platform}
app.keycloak.client-id=${KEYCLOAK_CLIENT_ID:edunex-platform-client}
app.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:uIaR8wMBdeKoXzOEysRS8lN8fzRBezgG}
app.keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8080}
app.keycloak.password-reset-redirect-uri=${PASSWORD_RESET_REDIRECT_URI:http://localhost:3000/reset-password}
app.keycloak.login-url=${KEYCLOAK_SERVER_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:edunex-platform}/protocol/openid-connect/auth?client_id=${KEYCLOAK_CLIENT_ID:edunex-platform-client}&response_type=code&scope=openid
app.keycloak.google-login-url=${KEYCLOAK_SERVER_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:edunex-platform}/protocol/openid-connect/auth?client_id=${KEYCLOAK_CLIENT_ID:edunex-platform-client}&response_type=code&scope=openid&kc_idp_hint=google

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:DEBUG}
logging.level.org.keycloak=${LOG_LEVEL_KEYCLOAK:DEBUG}
logging.level.org.springframework=${LOG_LEVEL_SPRING:INFO}
