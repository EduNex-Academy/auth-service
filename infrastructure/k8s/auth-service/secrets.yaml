apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: auth-service
type: Opaque
stringData:
  # Server Configuration
  SERVER_PORT: "8081"

  # Keycloak Configuration - Using your existing Keycloak in the keycloak namespace
  KEYCLOAK_SERVER_URL: "http://keycloak-service.keycloak.svc.cluster.local:8080"
  KEYCLOAK_REALM: "edunex-platform"  # Update with your actual realm name
  KEYCLOAK_CLIENT_ID: "edunex-platform-client"  # Configure this in your Keycloak admin console
  KEYCLOAK_CLIENT_SECRET: "MH4NziDu5gV4B1MyoVtIdhmhLepw3dEH"  # Get this from Keycloak after creating the client

  # Redirect URIs - Update these based on your actual service URLs
  KEYCLOAK_REDIRECT_URI: "http://auth-service.local/auth/callback"
  KEYCLOAK_ADMIN_REDIRECT_URI: "http://auth-service.local/admin/auth/callback"
  KEYCLOAK_PASSWORD_RESET_REDIRECT_URI: "http://auth-service.local/password-reset"
  KEYCLOAK_ADMIN_PASSWORD_RESET_REDIRECT_URI: "http://auth-service.local/admin/password-reset"

  # Logging levels
  LOG_LEVEL_SECURITY: "INFO"
  LOG_LEVEL_KEYCLOAK: "INFO"
  LOG_LEVEL_SPRING: "INFO"

