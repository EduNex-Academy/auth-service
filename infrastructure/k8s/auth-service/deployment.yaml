apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: auth-service
  labels:
    app: auth-service
spec:
  replicas: 1  # Single replica for cost optimization
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: akskeycloakdevauthacrakskeycloakdevauth.azurecr.io/auth-service:latest  # Update with your ACR URL
        ports:
        - containerPort: 8081
          name: http
        env:
        - name: SERVER_PORT
          valueFrom:
            secretKeyRef:
              name: auth-service-secret
              key: SERVER_PORT
        - name: KEYCLOAK_SERVER_URL
          valueFrom:
            secretKeyRef:
              name: auth-service-secret
              key: KEYCLOAK_SERVER_URL
        - name: KEYCLOAK_REALM
          valueFrom:
            secretKeyRef:
              name: auth-service-secret
              key: KEYCLOAK_REALM
        - name: KEYCLOAK_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: auth-service-secret
              key: KEYCLOAK_CLIENT_ID
        - name: KEYCLOAK_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: auth-service-secret
              key: KEYCLOAK_CLIENT_SECRET
        - name: KEYCLOAK_REDIRECT_URI
          valueFrom:
            secretKeyRef:
              name: auth-service-secret
              key: KEYCLOAK_REDIRECT_URI
        - name: KEYCLOAK_ADMIN_REDIRECT_URI
          valueFrom:
            secretKeyRef:
              name: auth-service-secret
              key: KEYCLOAK_ADMIN_REDIRECT_URI
        - name: KEYCLOAK_PASSWORD_RESET_REDIRECT_URI
          valueFrom:
            secretKeyRef:
              name: auth-service-secret
              key: KEYCLOAK_PASSWORD_RESET_REDIRECT_URI
        - name: KEYCLOAK_ADMIN_PASSWORD_RESET_REDIRECT_URI
          valueFrom:
            secretKeyRef:
              name: auth-service-secret
              key: KEYCLOAK_ADMIN_PASSWORD_RESET_REDIRECT_URI
        - name: LOG_LEVEL_SECURITY
          valueFrom:
            secretKeyRef:
              name: auth-service-secret
              key: LOG_LEVEL_SECURITY
        - name: LOG_LEVEL_KEYCLOAK
          valueFrom:
            secretKeyRef:
              name: auth-service-secret
              key: LOG_LEVEL_KEYCLOAK
        - name: LOG_LEVEL_SPRING
          valueFrom:
            secretKeyRef:
              name: auth-service-secret
              key: LOG_LEVEL_SPRING
        # Resource limits optimized for student plan
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "300m"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: auth-service
  labels:
    app: auth-service
spec:
  selector:
    app: auth-service
  ports:
  - name: http
    port: 8081
    targetPort: 8081
    protocol: TCP
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-service-ingress
  namespace: auth-service
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: auth-service.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 8081

